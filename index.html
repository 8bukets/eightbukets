<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sidebar-scroll {
            height: calc(100vh - 4rem);
            overflow-y: auto;
        }
        .main-scroll {
            height: calc(100vh - 4rem);
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans h-screen overflow-hidden flex flex-col">
    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center h-16">
        <h1 class="text-xl font-bold">✨ Master Prompt Library</h1>
        <span class="text-indigo-200 text-sm">50 High-Impact Prompts</span>
    </header>

    <!-- App Container -->
    <div class="flex flex-1 overflow-hidden">

        <!-- Sidebar -->
        <aside class="w-1/3 bg-white border-r border-gray-200 sidebar-scroll flex flex-col">
            <div class="p-4 border-b border-gray-100 bg-gray-50 sticky top-0 z-10 shadow-sm">
                <input type="text" id="search-input" placeholder="Search prompts..." class="w-full px-4 py-2 rounded border border-gray-300 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
            </div>
            <div id="sidebar-content" class="flex-1 p-4 space-y-6">
                <!-- Categories and Prompts will be rendered here -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="w-2/3 bg-gray-50 main-scroll flex flex-col">
            <div id="welcome-message" class="flex-1 flex items-center justify-center text-gray-500">
                <div class="text-center">
                    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                    <h3 class="mt-2 text-sm font-medium text-gray-900">No prompt selected</h3>
                    <p class="mt-1 text-sm text-gray-500">Select a prompt from the sidebar to start generating.</p>
                </div>
            </div>

            <div id="prompt-workspace" class="hidden flex-1 p-8 flex flex-col gap-6 max-w-4xl mx-auto w-full">

                <!-- Prompt Info -->
                <div>
                    <span id="prompt-category" class="text-indigo-600 text-sm font-semibold tracking-wide uppercase">Category</span>
                    <h2 id="prompt-title" class="text-3xl font-bold mt-1 mb-2">Prompt Title</h2>
                </div>

                <div class="flex gap-6 flex-1">
                    <!-- Dynamic Form (Left Column) -->
                    <div class="w-1/3 flex flex-col gap-4">
                        <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                            <h3 class="font-medium text-lg border-b border-gray-100 pb-2 mb-4">Variables</h3>
                            <p id="no-variables-msg" class="text-gray-500 text-sm hidden">This prompt has no dynamic variables.</p>
                            <form id="dynamic-form" class="space-y-4">
                                <!-- Inputs generated here -->
                            </form>
                        </div>
                    </div>

                    <!-- Output Area (Right Column) -->
                    <div class="w-2/3 flex flex-col gap-2">
                        <div class="flex justify-between items-end mb-1">
                            <h3 class="font-medium text-lg text-gray-800">Final Prompt</h3>
                            <button id="copy-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded shadow-sm text-sm font-medium transition-colors flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                </svg>
                                Copy to Clipboard
                            </button>
                        </div>
                        <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm flex-1 relative">
                            <div id="prompt-output" contenteditable="true" class="w-full h-full resize-none focus:outline-none text-gray-800 bg-transparent whitespace-pre-wrap font-mono text-sm leading-relaxed overflow-y-auto"></div>
                            <div id="copy-toast" class="absolute top-4 right-4 bg-gray-800 text-white px-3 py-1 rounded text-xs opacity-0 transition-opacity duration-300 pointer-events-none">Copied!</div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
